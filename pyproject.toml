[tool.poetry]
package-mode = false
name = "ansible-collection-cisco-catalystwan"
description = "Ansible modules using catalystwan SDK."
authors = ["acichon <acichon@cisco.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
ansible = "14.4.0"
catalystwan = "0.41.5.dev2"
pydantic = ">=2.7,<3.0"
requests = ">=2.32.5,<3.0"
certifi = ">=2026.10.19"
urllib3 = ">=2.8.0,<3.0"
setuptools = ">=84.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
known_third_party = ["catalystwan"]
