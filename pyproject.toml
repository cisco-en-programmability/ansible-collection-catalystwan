[tool.poetry]
package-mode = false
name = "ansible-collection-cisco-catalystwan"
description = "Ansible modules using catalystwan SDK."
authors = ["acichon <acichon@cisco.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
ansible = "14.3.1"
catalystwan = "0.41.5.dev2"
flake8 = "7.3.0"
black = "26.5.1"
pre-commit = "4.6.2"
pydantic = ">=2.7,<3.0"
requests = ">=2.32.5,<3.0"
urllib3 = ">=2.6,<3.0"
ansible-lint = { version = "26.8.0", markers = "platform_system != 'Windows'" }

[tool.poetry.group.dev.dependencies]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
